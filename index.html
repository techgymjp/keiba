<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ダービージョッキー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>

    <!-- レース中 HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-box" id="hud-rank"><span class="big">-</span><small id="hud-field">番手 / 18頭</small></div>
        <div class="hud-box center" id="hud-dist"><small data-i18n="hud.remain">残り</small><span class="big">2400</span><small>m</small><div id="hud-section"></div></div>
        <div class="hud-box right" id="hud-time"><span class="big">0:00.0</span></div>
      </div>
      <div id="commentary"></div>
      <div id="feel"></div>
      <div class="hud-bottom">
        <div class="hud-box" id="hud-stamina">
          <small data-i18n="hud.stamina">手応え</small>
          <div class="bar"><div class="fill"></div></div>
          <div id="hud-ride"></div>
        </div>
        <canvas id="minimap" width="220" height="150"></canvas>
      </div>
      <div id="center-msg"></div>
    </div>

    <!-- スマホ用操作 -->
    <div id="touch" class="hidden">
      <div class="tgroup left">
        <button data-key="left">◀<small data-i18n="touch.in">内へ</small></button>
        <button data-key="right">▶<small data-i18n="touch.out">外へ</small></button>
      </div>
      <div class="tgroup right">
        <button data-key="down" data-i18n="touch.hold">抑える</button>
        <button data-key="up" data-i18n="touch.push">追う</button>
        <button data-key="whip" class="whip" data-i18n="touch.whip">ムチ</button>
      </div>
    </div>

    <!-- タイトル -->
    <section id="title" class="screen">
      <div class="panel">
        <div class="logo">
          <div class="logo-sub" data-i18n="logo.sub">G1 ROAD ・ 2月〜12月 G1 全24戦</div>
          <h1 data-i18n-html="logo.title">ダービー<span>ジョッキー</span></h1>
        </div>
        <div class="horse-card">
          <div class="row">
            <label data-i18n="title.partner">あなたの相棒</label>
            <input id="horse-name" maxlength="18" spellcheck="false">
          </div>
          <div class="stats">
            <div><small data-i18n="title.record">戦績</small><b id="rec"></b></div>
            <div><small data-i18n="title.wins">ビッグレース</small><b id="wins"></b></div>
            <div><small data-i18n="title.style">脚質</small><b id="style-label">？？？</b></div>
          </div>
          <div id="next-race"></div>
          <div id="season-strip" class="season-strip"></div>
          <p class="hint" id="style-hint">脚質（逃げ・先行・差し・追込）は生まれつき。乗りながら見極めろ。</p>
        </div>
        <div class="buttons">
          <button id="btn-start" class="primary" data-i18n="title.start">出走する</button>
          <button id="btn-history" data-i18n="title.history">戦績ノート</button>
          <button id="btn-help" data-i18n="title.help">乗り方</button>
        </div>
        <button id="btn-newhorse" class="link" data-i18n="title.newHorse">新しい馬に乗り替わる</button>
        <p class="legal">
          <span id="build-info"></span>
          <a href="https://techgym.jp/privacy-policy/" data-i18n-href="url.privacy" target="_blank" rel="noopener" data-i18n="legal.privacy">プライバシーポリシー</a>
          <span id="ad-privacy" class="hidden">｜<a href="#" id="ad-privacy-link" data-i18n="legal.adSettings">広告の設定</a></span>
        </p>
        <p class="lang-sel"><button class="lang-btn" data-lang="ja">日本語</button><button class="lang-btn" data-lang="en">English</button></p>
      </div>
    </section>

    <!-- 乗り方 -->
    <section id="help" class="screen hidden">
      <div class="panel">
        <h2 data-i18n="help.title">乗り方</h2>
        <table class="keys" id="help-keys"></table>
        <h3 data-i18n="help.knowTitle">この馬を知ること</h3>
        <p data-i18n="help.know"></p>
        <ul data-i18n-html="help.styles"></ul>
        <h3 data-i18n="help.seasonTitle">G1 全24戦</h3>
        <p data-i18n="help.season"></p>
        <p data-i18n="help.clue"></p>
        <div class="buttons"><button class="primary back" data-i18n="common.back">戻る</button></div>
      </div>
    </section>

    <!-- 戦績 -->
    <section id="history" class="screen hidden">
      <div class="panel wide">
        <h2 data-i18n="hist.title">戦績ノート</h2>
        <div class="table-wrap">
          <table class="hist">
            <thead data-i18n-html="hist.head"></thead>
            <tbody id="hist-body"></tbody>
          </table>
        </div>
        <div class="buttons"><button class="primary back" data-i18n="common.back">戻る</button></div>
      </div>
    </section>

    <!-- 結果 -->
    <section id="result" class="screen hidden">
      <div class="panel wide">
        <div id="res-headline"></div>
        <div class="table-wrap">
          <table class="res">
            <thead data-i18n-html="res.head"></thead>
            <tbody id="res-body"></tbody>
          </table>
        </div>
        <div id="res-notes"></div>
        <div class="share-row">
          <button id="btn-share" class="share" data-i18n="share.btn">シェアする</button>
          <button id="btn-copy" class="share" data-i18n="share.copy">結果をコピー</button>
          <span id="share-msg"></span>
        </div>
        <div id="retry-box" class="hidden">
          <button id="btn-retry" class="retry" data-i18n="res.retry">▶ 広告を見て、このレースをやり直す</button>
          <span id="retry-msg"></span>
        </div>
        <div class="buttons">
          <button id="btn-again" class="primary">次のレースへ</button>
          <button id="btn-season-end" class="primary hidden" data-i18n="res.seasonEnd">シーズン終了 ── タイトルへ</button>
          <button id="btn-totitle" data-i18n="res.toTitle">タイトルへ</button>
        </div>
      </div>
    </section>

    <div id="pause" class="screen hidden"><div class="panel"><h2 data-i18n="pause.title">一時停止</h2><div class="buttons"><button class="primary" id="btn-resume" data-i18n="pause.resume">再開</button><button id="btn-quit" data-i18n="pause.quit">レースをやめる</button></div></div></div>
    <button id="btn-mute" title="消音 (M)" data-i18n-title="common.mute">♪</button>
    <div id="caption" class="hidden"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/build-info.js"></script>
  <script src="js/ads-config.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
