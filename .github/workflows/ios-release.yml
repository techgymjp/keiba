name: iOS release (TestFlight)

# push するたびに、本番広告の設定で iOS 版をビルドし、App Store Connect（TestFlight）にアップロードする。
# 審査への提出は App Store Connect で行う（docs/IOS_BUILD.md）。
# 必要な Secrets：IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD / ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64
on:
  push:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'ios/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:

# 同じブランチで新しい push があったら、古いビルドは取り消して最新だけをアップロードする
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    # 既定のブランチだけ（作業用のブランチの push ではアップロードしない）
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_SECRETS: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
      # 手元の Mac から上げるビルド（1, 2, 3…）とぶつからないよう、101 から始める
      BUILD_NUMBER: ${{ github.run_number + 100 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: GNM3VTX9YG
    steps:
      - name: Check secrets
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::warning::iOS の Secrets が登録されていないので、アップロードを飛ばします（docs/IOS_BUILD.md の 7 章）"

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.HAS_SECRETS == 'true'
        timeout-minutes: 5
        run: npm ci

      - name: Copy web assets into the iOS project (production ads)
        if: env.HAS_SECRETS == 'true'
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          ADMOB_MODE=production VERSION_CODE="$BUILD_NUMBER" VERSION_NAME="$(node -p "require('./package.json').version")" npm run build
          npx cap sync ios

      # 配布用の証明書を、このジョブだけの一時的なキーチェーンに入れる
      - name: Import the distribution certificate
        if: env.HAS_SECRETS == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # App Store Connect の API キー（プロファイルの自動作成とアップロードに使う）
      - name: Write the App Store Connect API key
        if: env.HAS_SECRETS == 'true'
        env:
          P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive
        if: env.HAS_SECRETS == 'true'
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$VERSION_NAME" \
            archive | tail -60

      # destination: upload で、書き出しと同時に App Store Connect へアップロードする
      - name: Upload to App Store Connect
        if: env.HAS_SECRETS == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -60
          echo "::notice::ビルド ${VERSION_NAME} (${BUILD_NUMBER}) を App Store Connect にアップロードしました。10〜30 分で TestFlight に表示されます"

      - name: Clean up
        if: always() && env.HAS_SECRETS == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
